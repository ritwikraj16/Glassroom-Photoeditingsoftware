[package]
name = "glassroom"
version = "0.1.0"
edition = "2021"
description = "Glassroom — local catalog photo library and JPEG develop (Classic-style workflow)"
license = "Apache-2.0"
authors = ["Glassroom contributors"]
repository = "https://github.com/ritwikraj16/Glassroom-Photoeditingsoftware"
readme = "README.md"
keywords = ["photo", "catalog", "jpeg", "develop"]
categories = ["multimedia", "graphics"]

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
directories = "5"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
